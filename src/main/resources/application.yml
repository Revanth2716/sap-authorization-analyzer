server:
  port: 8087
  servlet:
    session:
      timeout: 30m
    cookie:
      http-only: true
      same-site: lax

spring:
  application:
    name: "SAP Authorisation & Access Governance Analyzer"

  datasource:
    url: jdbc:h2:file:./data/accessdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  thymeleaf:
    cache: true
    encoding: UTF-8

  mail:
    host: localhost
    port: 1025

logging:
  level:
    root: INFO
    com.revzz.sap.access: INFO

# ---------------------------------------------------------------------------
# Application configuration
# ---------------------------------------------------------------------------
access:
  application-name: "SAP Authorisation & Access Governance Analyzer"
  sap-system: "PFCG"
  # local  - read the authorisation data from the local database (the default)
  # jco    - read it from a live SAP system over RFC (needs the with-jco profile)
  gateway: "local"
  seed-demo-users: true
  seed-demo-data: true
  demo-password: "demo1234"

  seed:
    random-seed: 20261113

  policy:
    # A role that nobody holds is dead weight - it still has to be cleaned up.
    orphan-role-days: 90
    # How many systems a role may differ in before it counts as drift.
    max-drift-systems: 0
    # A composite role that expands to more than this many atomic roles is
    # too broad to reason about.
    max-composite-expansion: 5

  mail:
    enabled: false
    from: "access-governance@example.com"
    to: "basis-team@example.com"
    subject-prefix: "[SAP Access]"
